[project]
name = "fine-tuning-lab"
version = "0.1.0"
description = "A Quarto-driven lab for LLM fine-tuning on ConvFinQA with Hugging Face"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "accelerate",
    "peft",
    "trl",
    "xgrammar",
    "sympy",
    "tensorboard",
]

[project.scripts]
train-adapter = "convfinqa.cli.train:main"
chat = "convfinqa.cli.chat:main"
print-example = "convfinqa.cli.example:main"

[dependency-groups]
dev = [
    "ipykernel",
    "matplotlib",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas",
    "pytest",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "convfinqa"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[tool.pytest.ini_options]
testpaths = ["tests"]
