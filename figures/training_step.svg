<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330">
<rect width="780" height="330" fill="white"/>
<rect x="25" y="70" width="120" height="62" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="85" y="94" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#2b2b2b"><tspan x="85" dy="0">Batch</tspan></text>
<text x="85" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#555555"><tspan x="85" dy="0">input_ids, labels</tspan><tspan x="85" dy="13">from the training data</tspan></text>
<path d="M 145 101 L 166 101" fill="none" stroke="#2b2b2b" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="175.00,101.00 166.00,96.50 166.00,105.50" fill="#2b2b2b"/>
<rect x="175" y="70" width="120" height="62" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="235" y="94" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#2b2b2b"><tspan x="235" dy="0">Forward pass</tspan></text>
<text x="235" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#555555"><tspan x="235" dy="0">logits at every</tspan><tspan x="235" dy="13">position</tspan></text>
<path d="M 295 101 L 316 101" fill="none" stroke="#2b2b2b" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="325.00,101.00 316.00,96.50 316.00,105.50" fill="#2b2b2b"/>
<rect x="325" y="70" width="120" height="62" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="385" y="94" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#2b2b2b"><tspan x="385" dy="0">Loss</tspan></text>
<text x="385" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#555555"><tspan x="385" dy="0">cross-entropy on the</tspan><tspan x="385" dy="13">unmasked tokens</tspan></text>
<path d="M 445 101 L 466 101" fill="none" stroke="#2b2b2b" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="475.00,101.00 466.00,96.50 466.00,105.50" fill="#2b2b2b"/>
<rect x="475" y="70" width="120" height="62" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="535" y="94" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#2b2b2b"><tspan x="535" dy="0">Backward pass</tspan></text>
<text x="535" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#555555"><tspan x="535" dy="0">gradient of the loss</tspan><tspan x="535" dy="13">for every weight</tspan></text>
<path d="M 595 101 L 616 101" fill="none" stroke="#2b2b2b" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="625.00,101.00 616.00,96.50 616.00,105.50" fill="#2b2b2b"/>
<rect x="625" y="70" width="120" height="62" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="685" y="94" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#2b2b2b"><tspan x="685" dy="0">Optimizer step</tspan></text>
<text x="685" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#555555"><tspan x="685" dy="0">AdamW changes</tspan><tspan x="685" dy="13">the weights</tspan></text>
<path d="M 685 70 L 685.00 44.00 Q 685 34 675.00 34.00 L 95.00 34.00 Q 85 34 85.00 44.00 L 85 61" fill="none" stroke="#2b2b2b" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="85.00,70.00 89.50,61.00 80.50,61.00" fill="#2b2b2b"/>
<text x="385" y="24" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#555555"><tspan x="385" dy="0">repeat with the next batch</tspan></text>
<rect x="165" y="205" width="140" height="70" rx="8" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="235" y="229" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2b2b2b"><tspan x="235" dy="0">Weights</tspan></text>
<text x="235" y="247" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#555555"><tspan x="235" dy="0">one number per</tspan><tspan x="235" dy="13">parameter</tspan></text>
<rect x="465" y="205" width="140" height="70" rx="8" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="535" y="229" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2b2b2b"><tspan x="535" dy="0">Gradients</tspan></text>
<text x="535" y="247" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#555555"><tspan x="535" dy="0">one number per</tspan><tspan x="535" dy="13">trainable weight</tspan></text>
<rect x="615" y="205" width="140" height="70" rx="8" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="685" y="229" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2b2b2b"><tspan x="685" dy="0">Optimizer state</tspan></text>
<text x="685" y="247" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#555555"><tspan x="685" dy="0">two more per trainable</tspan><tspan x="685" dy="13">weight (AdamW: m and v)</tspan></text>
<path d="M 235 205 L 235 141" fill="none" stroke="#2b2b2b" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="235.00,132.00 230.50,141.00 239.50,141.00" fill="#2b2b2b"/>
<path d="M 535 132 L 535 196" fill="none" stroke="#2b2b2b" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="535.00,205.00 539.50,196.00 530.50,196.00" fill="#2b2b2b"/>
<path d="M 685 205 L 685 132" fill="none" stroke="#2b2b2b" stroke-width="1.5" stroke-linejoin="round"/>
<text x="20" y="313" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#555555"><tspan x="20" dy="0">Memory holds the weights, the gradients and the optimizer state at the same time; activations are kept for the backward pass.</tspan></text>
<text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#2b2b2b"><tspan x="20" dy="0">One training step</tspan></text>
</svg>
