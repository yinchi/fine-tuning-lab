project:
  type: book
  output-dir: _book
  pre-render: ../scripts/pre_render.py

book:
  title: "Fine-tuning lab: LLMs on ConvFinQA"
  author: "Yin-Chi Chan"
  chapters:
    - index.qmd
    - part: "Setup & data"
      chapters:
        - 101_environment_setup.qmd
        - 102_what_convfinqa.qmd
        - 103_the_dsl.qmd
    - part: "Foundations"
      chapters:
        - 201_from_text.qmd
        - 202_anatomy_of.qmd
        - 203_from_base.qmd
        - 204_probing_the.qmd
        - 205_how_fine_tuning.qmd
        - 206_lora_in.qmd
    - part: "Experiments"
      chapters:
        - 301_formatting_conversations.qmd
        - 302_the_untuned.qmd
        - 303_training_with.qmd
        - 304_evaluating_the.qmd
        - 305_dsl_vs.qmd
        - 306_constrained_decoding.qmd
    - part: "Beyond"
      chapters:
        - 403_rank_sweep.qmd
  appendices:
    - 901_glossary.qmd
    - 902_references.qmd

number-sections: true
bibliography: references.bib

execute:
  freeze: auto

jupyter: fine-tuning-lab

format:
  html:
    theme: cosmo
    code-fold: show
    code-tools: true
