project:
  type: book
  output-dir: _book
  pre-render: ../scripts/pre_render.py

book:
  title: "Fine-tuning lab: LLMs on ConvFinQA"
  author: "Yin-Chi Chan"
  chapters:
    - index.qmd
    - part: "Setup & data"
      chapters:
        - 101_environment_setup.qmd
        - 102_what_convfinqa.qmd
        - 103_the_dsl.qmd
    - part: "Foundations"
      chapters:
        - 201_from_text.qmd
        - 202_anatomy_of.qmd
        - 203_from_base.qmd
  appendices:
    - 902_references.qmd

number-sections: true
bibliography: references.bib

execute:
  freeze: auto

jupyter: fine-tuning-lab

format:
  html:
    theme: cosmo
    code-fold: show
    code-tools: true
