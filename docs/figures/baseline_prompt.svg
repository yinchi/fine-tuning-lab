<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290">
<rect width="900" height="290" fill="white"/>
<text x="20" y="26" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#2b2b2b"><tspan x="20" dy="0">One prompt: turn k of a target conversation</tspan></text>
<rect x="20" y="66" width="90" height="56" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.5"/>
<text x="65" y="90" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2b2b2b"><tspan x="65" dy="0">system</tspan><tspan x="65" dy="14">message</tspan></text>
<rect x="116" y="66" width="112" height="56" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="172" y="90" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2b2b2b"><tspan x="172" dy="0">example</tspan><tspan x="172" dy="14">conversation A</tspan></text>
<rect x="234" y="66" width="112" height="56" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="290" y="90" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2b2b2b"><tspan x="290" dy="0">example</tspan><tspan x="290" dy="14">conversation B</tspan></text>
<rect x="352" y="66" width="128" height="56" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="416" y="90" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2b2b2b"><tspan x="416" dy="0">target conversation</tspan><tspan x="416" dy="14">Q1 A1 … Qk</tspan></text>
<rect x="486" y="66" width="80" height="56" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="526" y="90" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2b2b2b"><tspan x="526" dy="0">the model</tspan><tspan x="526" dy="14">writes Ak</tspan></text>
<text x="65" y="54" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555"><tspan x="65" dy="0">one line, or + DSL</tspan></text>
<text x="231" y="54" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555"><tspan x="231" dy="0">0, 2 or 3 train-fit conversations: one set</tspan></text>
<path d="M 20 132 L 20.00 136.00 Q 20 140 24.00 140.00 L 342.00 140.00 Q 346 140 346.00 136.00 L 346 132" fill="none" stroke="#2b2b2b" stroke-width="1.5" stroke-linejoin="round"/>
<text x="183" y="160" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#555555"><tspan x="183" dy="0">fixed: identical in every prompt of a run</tspan></text>
<path d="M 352 132 L 352.00 136.00 Q 352 140 356.00 140.00 L 562.00 140.00 Q 566 140 566.00 136.00 L 566 132" fill="none" stroke="#2b2b2b" stroke-width="1.5" stroke-linejoin="round"/>
<text x="459" y="160" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#555555"><tspan x="459" dy="0">changes with every turn</tspan></text>
<text x="20" y="186" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#555555"><tspan x="20" dy="0">The system message is a single line, or the same line plus a compact description of the DSL and the rule that</tspan><tspan x="20" dy="14">an answer is a program and nothing else. With no examples the prompt has no blue part.</tspan></text>
<text x="620" y="26" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#2b2b2b"><tspan x="620" dy="0">The baseline: one run</tspan></text>
<rect x="620" y="56" width="70" height="36" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="655" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2b2b2b"><tspan x="655" dy="0">set 1</tspan></text>
<path d="M 690 74 L 707 74" fill="none" stroke="#2b2b2b" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="716.00,74.00 707.00,69.50 707.00,78.50" fill="#2b2b2b"/>
<rect x="720" y="56" width="110" height="36" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.5"/>
<text x="775" y="71" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2b2b2b"><tspan x="775" dy="0">pass over every</tspan></text>
<text x="775" y="84" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2b2b2b"><tspan x="775" dy="0">turn of the split</tspan></text>
<path d="M 830 74 L 833 74" fill="none" stroke="#2b2b2b" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="842.00,74.00 833.00,69.50 833.00,78.50" fill="#2b2b2b"/>
<text x="848" y="78" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#2b2b2b"><tspan x="848" dy="0">accuracy</tspan></text>
<text x="620" y="126" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#2b2b2b"><tspan x="620" dy="0">Report the result with its interval.</tspan></text>
<text x="20" y="258" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#555555"><tspan x="20" dy="0">A set is fixed by its seed, so the same seed gives the same examples whichever split is evaluated.</tspan></text>
<text x="20" y="274" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#555555"><tspan x="20" dy="0">Blue: train-fit conversations (never val or dev). Yellow: the conversation being evaluated.</tspan></text>
</svg>
